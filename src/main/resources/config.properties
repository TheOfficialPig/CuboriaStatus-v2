# CuboriaStatus 0.5.0
# Keep your bot token private.
discord.token=PASTE_NEW_BOT_TOKEN_HERE
discord.channel-id=PASTE_CHANNEL_ID_HERE

# Update interval in seconds (minimum 15)
update.seconds=30

# Address shown in the footer
network.address=play.cuborianetwork.net

# Display capacity only. This does not enforce player limits.
network.max-players=10000

# Servers to show, using Velocity server IDs.
servers=oneblock,arcade

# Display names
server.oneblock=OneBlock
server.arcade=Arcade

# Display max players per server
server.oneblock.max-players=10000
server.arcade.max-players=10000
